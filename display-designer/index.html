<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Display Designer</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #15171a;
        --panel: #1e2126;
        --panel-2: #262a31;
        --line: #343942;
        --text: #e6e8eb;
        --muted: #959ba5;
        --accent: #5aa7ff;
        --warn: #ffb454;
        --err: #ff6b6b;
        --ok: #6bd68a;
        --lcd-bg: #dfe3d8;
        --lcd-ink: #17191c;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef0f3;
          --panel: #fff;
          --panel-2: #f3f5f8;
          --line: #d3d8df;
          --text: #1b1f24;
          --muted: #5f6772;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      header h1 {
        font-size: 16px;
        margin: 0 8px 0 0;
      }
      header .spacer {
        flex: 1;
      }
      button,
      select,
      input[type="text"],
      input[type="number"],
      input[type="datetime-local"] {
        font: inherit;
        color: var(--text);
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #06121f;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        color: var(--muted);
      }
      #status.dirty {
        color: var(--warn);
      }
      #status.ok {
        color: var(--ok);
      }
      #status.err {
        color: var(--err);
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        gap: 16px;
        padding: 16px;
        align-items: start;
      }
      @media (max-width: 980px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      .previews {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        justify-content: center;
      }
      .half h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 8px;
        text-align: center;
      }
      .bezel {
        background: #0b0c0e;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
      }
      .screen {
        position: relative;
        width: 272px;
        height: 640px;
      }
      .screen canvas {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        display: block;
      }
      .slot {
        position: absolute;
        outline: 1px dashed rgba(90, 167, 255, 0);
        cursor: pointer;
      }
      .slot:hover {
        outline-color: rgba(90, 167, 255, 0.8);
        background: rgba(90, 167, 255, 0.1);
      }
      .slot.sel {
        outline: 2px solid var(--accent);
        background: rgba(90, 167, 255, 0.12);
      }
      .slot .tag {
        position: absolute;
        left: 2px;
        top: 2px;
        font-size: 10px;
        background: var(--accent);
        color: #06121f;
        padding: 0 4px;
        border-radius: 3px;
        display: none;
      }
      .slot:hover .tag,
      .slot.sel .tag {
        display: block;
      }
      .meta {
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
        min-height: 18px;
      }
      aside {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      section h3 {
        margin: 0 0 10px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      .row {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
      }
      .row > label {
        color: var(--muted);
      }
      .row input[type="range"] {
        width: 100%;
      }
      .row .val {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .inline {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin: 6px 0 0;
      }
      .warn {
        color: var(--warn);
      }
      .thumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 8px;
      }
      .thumbs canvas {
        image-rendering: pixelated;
        background: var(--lcd-bg);
        border: 1px solid var(--line);
        height: 36px;
        width: auto;
      }
      input[type="text"],
      input[type="datetime-local"] {
        width: 100%;
      }
      #build-log {
        max-height: 320px;
        overflow: auto;
        margin: 8px 0 0;
        padding: 8px;
        background: var(--bg);
        border-radius: 6px;
        font:
          12px/1.35 ui-monospace,
          monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #build-files code {
        user-select: all;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Display Designer</h1>
      <button id="btn-save" class="primary" title="Ctrl+S">
        In Repo speichern
      </button>
      <button id="btn-build" title="Speichert und startet ./build-lily58.sh -p">
        Speichern &amp; bauen
      </button>
      <button id="btn-download">layout.json herunterladen</button>
      <button id="btn-load">layout.json öffnen…</button>
      <button id="btn-reset">Standard-Design</button>
      <span class="inline"
        ><input id="inv" type="checkbox" /><label for="inv"
          >Display invertieren (weiß auf schwarz)</label
        ></span
      >
      <span class="spacer"></span>
      <span id="status"></span>
      <input
        id="file-load"
        type="file"
        accept="application/json,.json"
        hidden
      />
    </header>
    <main>
      <div>
        <div class="previews" id="previews"></div>
        <section id="buildbox" hidden style="margin-top: 16px">
          <h3>
            Build <span id="build-state"></span>
            <button id="build-cancel" hidden style="float: right">
              Abbrechen
            </button>
          </h3>
          <div id="build-files" class="hint"></div>
          <pre id="build-log"></pre>
        </section>
        <p class="hint" style="text-align: center">
          Slot anklicken zum Bearbeiten. Die Vorschau ist pixelgenau dieselbe
          Zeichnung wie auf dem Gerät.
        </p>
      </div>
      <aside id="panel"></aside>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
